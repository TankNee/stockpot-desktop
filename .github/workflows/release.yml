name: Release

# 打个 tag 推上来就出安装包：
#   git tag v1.0.4 && git push origin v1.0.4
on:
  push:
    tags:
      - "v*"

# 建 release 和传附件要写权限，其余都不给
permissions:
  contents: write

# 同一个 tag 不并发跑两遍
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: 编译并发布
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag、package.json、tauri.conf.json、Cargo.toml 四处版本必须一样，
      # 不然装出来的包版本和 release 标题对不上，用户会以为下错了
      - name: 校验版本号
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag  package.json=$pkg  tauri.conf=$tauri  Cargo.toml=$cargo"
          for v in "$pkg" "$tauri" "$cargo"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::版本对不上：tag 是 $tag，配置里是 $v"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Rust 依赖编译最费时间，缓存住之后重跑能省五六分钟
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand 里会跑 pnpm build（tsc --noEmit + vite build），
      # 类型不过就直接停在编译这一步
      - name: 编译安装包
        run: pnpm tauri build --bundles nsis

      - name: 列出产物
        shell: bash
        run: |
          ls -lh src-tauri/target/release/bundle/nsis/

      # 除了发 release，也存一份 artifact：release 那步抽风时还能手工下
      - uses: actions/upload-artifact@v4
        with:
          name: stockpot-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 发布 release
        uses: softprops/action-gh-release@v2
        with:
          name: Stockpot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # 提交记录由 GitHub 按上一个 tag 到这之间的 commit 自动生成
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
