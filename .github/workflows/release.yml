name: Release

# 只有 macOS 在这里构建：它需要 macOS runner（.app + dmg 的打包和签名工具链），
# 本地那台 Windows 出不来。Windows 的 NSIS 包在本地打，打完用同样的 deploy 口投上来。
#
#   git tag v1.0.5 && git push origin v1.0.5      → CI 出 macOS，放进 GitHub release
#   pnpm tauri build --bundles nsis                → 本地出 Windows，投更新服务器
#
# macOS 的包不从 CI 直传服务器（海外 runner 往这边传几十兆太慢），
# 由管理台的「从 GitHub 同步」按需拉回来。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS（universal）
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # tag、package.json、tauri.conf.json、Cargo.toml 四处版本必须一样，
      # 不然装出来的包版本和 release 标题对不上，自动更新也会来回弹
      - name: 校验版本号
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$tag  package.json=$pkg  tauri.conf=$tauri  Cargo.toml=$cargo"
          for v in "$pkg" "$tauri" "$cargo"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::版本对不上：tag 是 $tag，配置里是 $v"
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # universal 包要两个架构都在，缺一个就只能出单架构的 dmg
      - name: 补架构
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      # 签名密钥只放在 GitHub Secrets 里：客户端靠这份签名确认包没被换过
      - name: 编译并签名
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # macOS 的 find 是 BSD 版，没有 -printf，这里只能用 -exec ls
      - name: 列出产物
        shell: bash
        run: |
          find src-tauri/target/universal-apple-darwin/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" \) \
            -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: stockpot-macos-${{ github.ref_name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
          if-no-files-found: error

  release:
    name: 发布 release
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理文件
        run: |
          mkdir -p out
          find dist -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} out/ \;
          ls -lh out

      # Windows 的 exe 由本地构建完 `gh release upload` 追加到同一个 release
      - uses: softprops/action-gh-release@v2
        with:
          name: Stockpot ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/*
